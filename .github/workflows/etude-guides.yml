name: Étude guides

# Étape 29 (intention v1.6, décision 10) : nos jeux rétro ont-ils des guides japonais (攻略本) trouvables, avec quels
# champs (éditeur, date, ISBN, pages) et quelle couverture ? Sources : NDL Search, openBD, Open Library, Google Books,
# Internet Archive.
# LECTURE SEULE (rien n'est écrit dans la base). Lancée à la main (onglet Actions → Étude guides → Run workflow).
# Rapport dans le résumé de la tâche, détail en pièce jointe (etude-guides.json).
on:
  workflow_dispatch:
    inputs:
      par_console:
        description: "Jeux par console"
        default: "20"
      consoles:
        description: "Consoles (ex. nes,snes)"
        default: "nes,snes,n64,gb,gbc"

permissions:
  contents: read

jobs:
  etude:
    name: Chercher les guides japonais d'un échantillon
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Étude (lecture seule)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GOOGLE_BOOKS_CLE: ${{ secrets.GOOGLE_BOOKS_CLE }}
          ETUDE_PAR_CONSOLE: ${{ inputs.par_console }}
          ETUDE_CONSOLES: ${{ inputs.consoles }}
        run: node scripts/etude-guides.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etude-guides
          path: etude-guides.json
          if-no-files-found: ignore

name: Guides NDL

# Étape 29 (SPEC US-28, DESIGN ADR-19 point 6), reprise du 26/11/2026 : cherche les guides japonais des jeux d'une ou
# plusieurs consoles chez NDL Search (un appel toutes les 6 s) et dépose, par console, guides-{console}.json et la
# planche dans le bucket PRIVÉ « gametdb » (guides/). Rien n'est écrit dans le catalogue : la session Claude montre la
# planche, puis écrit après l'accord du propriétaire (scripts/guides.mjs --recuperer puis --ecrire).
# Pourquoi une tâche : depuis la session, NDL refuse presque tout (429) et une commande s'arrête au bout de 2 h.
# Une tâche par console, en parallèle : NDL freine par adresse, et chaque machine de GitHub a la sienne (26/11 : 2 h
# sans finir les 44 jeux Wii U, consoles l'une après l'autre). Les réponses de NDL sont gardées (cache de GitHub,
# même après un arrêt à la limite de temps) : relancer la tâche reprend où elle s'était arrêtée.
# Lancée à la main (Actions → Guides NDL → Run workflow).
on:
  workflow_dispatch:
    inputs:
      consoles:
        description: "Consoles, chacune sur sa machine (ex. wii-u,wii,ds)"
        default: "wii-u,wii,ds"

permissions:
  contents: read

concurrency:
  group: guides-ndl

jobs:
  consoles:
    name: Liste des consoles
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    outputs:
      liste: ${{ steps.liste.outputs.liste }}
    steps:
      - id: liste
        env:
          CONSOLES: ${{ inputs.consoles }}
        run: echo "liste=$(jq -cn --arg c "$CONSOLES" '$c | split(",") | map(select(. != ""))')" >> "$GITHUB_OUTPUT"

  planches:
    name: Guides ${{ matrix.console }}
    needs: consoles
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        console: ${{ fromJSON(needs.consoles.outputs.liste) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Police japonaise de la planche
        continue-on-error: true # sans elle, les légendes de la planche sont illisibles, pas fausses
        timeout-minutes: 10
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-wqy-zenhei
      - name: Réponses déjà lues (relance)
        uses: actions/cache/restore@v4
        with:
          path: guides/cache
          key: guides-ndl-${{ matrix.console }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: guides-ndl-${{ matrix.console }}-
      - name: Planche (lecture seule pour le catalogue)
        timeout-minutes: 330 # laisse le temps de garder les réponses avant la limite de la tâche
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GOOGLE_BOOKS_CLE: ${{ secrets.GOOGLE_BOOKS_CLE }}
        run: node scripts/guides.mjs --console "${{ matrix.console }}" --planche guides --deposer
      - name: Garder les réponses lues
        if: always()
        uses: actions/cache/save@v4
        with:
          path: guides/cache
          key: guides-ndl-${{ matrix.console }}-${{ github.run_id }}-${{ github.run_attempt }}

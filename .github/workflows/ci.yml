name: CI

on:
  pull_request:
  push:
    branches: [main]

# Un nouveau push sur la même PR annule la vérification précédente, devenue inutile.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ⚠️ Les noms des jobs (« name: ») sont ceux exigés par la protection de main : ne pas les renommer
# sans mettre à jour la règle dans GitHub (Settings → Branches), sinon les PR restent bloquées.
jobs:
  verifications:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      # Le build lit le catalogue dans la base (pages préparées à l'avance, ADR-02) : il est fait par le job e2e,
      # qui dispose d'une base locale.

  e2e:
    name: Tests e2e (iPhone 12 mini, Chromium + WebKit)
    runs-on: ubuntu-latest
    # 35 min : l'installation des navigateurs peut bloquer sur un miroir Ubuntu lent (2 fois les 18-19/11/2026), elle
    # a alors droit à un second essai (ci-dessous).
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Supabase écoute sur des ports fixes (54320-54329), dans la plage des ports temporaires de Linux :
      # on déplace cette plage au-dessus (voir le job « Base de données »).
      - name: Libérer les ports de Supabase
        run: sudo sysctl -w net.ipv4.ip_local_port_range="60000 65000"
      # Base Supabase locale et jetable (connexion US-09) : jamais la base de production.
      - run: npx supabase start
      - name: Variables de la base locale
        run: |
          npx supabase status -o env > "$RUNNER_TEMP/supabase.env"
          set -a && . "$RUNNER_TEMP/supabase.env" && set +a
          publishable="${PUBLISHABLE_KEY:-$ANON_KEY}"
          secret="${SECRET_KEY:-$SERVICE_ROLE_KEY}"
          if [ -z "$API_URL" ] || [ -z "$publishable" ] || [ -z "$secret" ]; then
            echo "::error::Clés de la base locale introuvables dans supabase status" && exit 1
          fi
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$publishable"
            echo "E2E_SUPABASE_SECRET_KEY=$secret"
            echo "SUPABASE_SECRET_KEY=$secret"
          } >> "$GITHUB_ENV"
      # WebKit = moteur de Safari : vérifié ici, il n'est pas installé dans l'environnement de Claude.
      # Navigateurs gardés en cache d'une exécution à l'autre (clé : version de Playwright).
      - name: Cache des navigateurs Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # Paquets Ubuntu des navigateurs (WebKit en demande ≈ 150) gardés en cache : le miroir Ubuntu peut être très lent
      # (5 fois du 18 au 19/11/2026, jusqu'à 100 s pour un paquet), le téléchargement n'a lieu qu'une fois.
      - name: Cache des paquets Ubuntu des navigateurs
        id: cache-apt
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-archives
          key: apt-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Paquets en cache remis à apt
        if: steps.cache-apt.outputs.cache-hit == 'true'
        run: sudo cp ~/apt-archives/*.deb /var/cache/apt/archives/
      # 10 min au plus, puis un second essai (souvent sur un autre miroir).
      - name: Navigateurs et dépendances (1er essai)
        id: navigateurs
        continue-on-error: true
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium webkit
      # Le 1er essai arrêté laisse apt-get tourner et garder son verrou (« Could not get lock », #120, #135) : on
      # l'arrête et on répare dpkg avant de relancer.
      - name: Navigateurs et dépendances (2e essai)
        if: steps.navigateurs.outcome != 'success'
        timeout-minutes: 12
        run: |
          sudo pkill -9 -x apt-get || true
          sudo pkill -9 -x dpkg || true
          sudo rm -f /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend /var/cache/apt/archives/lock /var/lib/apt/lists/lock
          sudo dpkg --configure -a || true
          npx playwright install --with-deps chromium webkit
      - name: Paquets Ubuntu mis en cache
        if: steps.cache-apt.outputs.cache-hit != 'true'
        run: mkdir -p ~/apt-archives && cp /var/cache/apt/archives/*.deb ~/apt-archives/
      - name: Cache des paquets enregistré
        if: steps.cache-apt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-archives
          key: ${{ steps.cache-apt.outputs.cache-primary-key }}
      - run: npm run e2e
      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  base-de-donnees:
    name: Base de données (migrations, tests pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Supabase écoute sur des ports fixes (54320-54329), situés dans la plage des ports temporaires
      # que Linux attribue aux connexions sortantes (32768-60999) : l'un d'eux peut déjà être pris
      # (« address already in use », vu dans mon-site-sdlc). On déplace cette plage au-dessus.
      - name: Libérer les ports de Supabase
        run: sudo sysctl -w net.ipv4.ip_local_port_range="60000 65000"
      # Base Supabase locale et jetable : les migrations y sont appliquées depuis zéro, jamais en production.
      - run: npx supabase db start
      - name: Tests pgTAP (schéma, Row Level Security, stockage)
        run: npm run db:test
      - name: Types TypeScript à jour avec le schéma
        run: |
          # Le générateur produit un fichier non formaté : on le passe par Prettier, comme npm run db:types.
          npx supabase gen types typescript --schema public \
            | npx prettier --stdin-filepath src/types/database.ts > "$RUNNER_TEMP/database.ts"
          if ! diff -u src/types/database.ts "$RUNNER_TEMP/database.ts"; then
            echo "::error::src/types/database.ts n'est pas à jour : lancer npm run db:types"
            exit 1
          fi
